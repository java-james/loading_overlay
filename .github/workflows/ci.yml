name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: ./scripts/runTests.sh
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/tool
      - name: Generate API documentation
        run: dart doc --output build/api
      - name: Validate package contents
        run: flutter pub publish --dry-run
      - name: Build web example
        working-directory: example
        run: flutter build web --release --no-pub
      - name: Build Wasm example
        working-directory: example
        run: flutter build web --wasm --release --no-pub
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: lcov.info

  minimum-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true
      - name: Analyze and test the package on its minimum supported SDK
        run: ./scripts/checkMinimum.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Build Android example
        working-directory: example
        run: flutter build apk --debug
