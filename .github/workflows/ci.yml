name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.32.0', '3.50.0']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: ./scripts/runTests.sh
      - name: Check formatting
        if: matrix.flutter == '3.50.0'
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test
      - name: Build web example
        if: matrix.flutter == '3.50.0'
        working-directory: example
        run: flutter build web --release --no-pub

  minimum-sdk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '2.0.0'
          channel: stable
          cache: true
      - name: Test as a consumer on Dart 2.12
        run: ./scripts/test-compatibility.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Build Android example
        working-directory: example
        run: flutter build apk --debug
