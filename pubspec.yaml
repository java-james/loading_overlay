name: loading_overlay
description: Accessible Flutter loading overlays with concurrent async tasks, progress, scoped controllers, automatic cleanup, and no extra runtime dependencies.
version: 0.7.0
homepage: https://github.com/java-james/loading_overlay
repository: https://github.com/java-james/loading_overlay
issue_tracker: https://github.com/java-james/loading_overlay/issues
screenshots:
  - description: A custom loading overlay with upload progress and automatic async cleanup.
    path: doc/images/loading-overlay.png
  - description: Default, custom, and section-level loading overlays in real Flutter layouts.
    path: doc/images/overlay-styles.png
topics:
  - loading
  - overlay
  - progress
  - async
  - widgets

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
